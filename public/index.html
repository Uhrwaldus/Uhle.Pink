<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>uhle.pink — game night</title>
<style>
  :root {
    --bg: #12141c; --panel: #1c1f2b; --panel2: #252938;
    --text: #eef0f6; --muted: #9aa0b4;
    --blue: #4f7cff; --red: #ff5a5f;
    --band4: #ffd166; --band3: #ff8c5a; --band2: #3ecfb2;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 800px at 50% -200px, #232840, var(--bg));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 16px; touch-action: manipulation;
  }
  h1 { font-size: 1.6rem; margin: 12px 0 2px; letter-spacing: 1px; }
  .tagline { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
  .screen { display: none; width: 100%; max-width: 640px; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 20px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  input[type=text], input[type=number], select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #3a4057;
    background: var(--panel2); color: var(--text); font-size: 1rem; margin-bottom: 10px; outline: none;
  }
  input:focus, select:focus { border-color: var(--blue); }
  button {
    padding: 12px 18px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 1rem; font-weight: 600; color: #fff; background: var(--blue);
    transition: transform .06s ease, filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: default; }
  button.secondary { background: #3a4057; }
  button.red { background: var(--red); }
  .row { display: flex; gap: 10px; width: 100%; }
  .row > * { flex: 1; }
  .divider { color: var(--muted); text-align: center; margin: 14px 0; font-size: .8rem; }
  .room-code { font-size: 2.4rem; font-weight: 800; letter-spacing: .35em; text-align: center; margin: 6px 0 2px; }
  .room-hint { color: var(--muted); text-align: center; font-size: .8rem; margin-bottom: 16px; }

  /* dashboard */
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; width: 100%; margin-bottom: 14px; }
  .game-card {
    background: var(--panel2); border-radius: 12px; padding: 12px; cursor: pointer;
    border: 2px solid transparent; text-align: center; transition: border-color .15s;
  }
  .game-card:hover { border-color: #3a4057; }
  .game-card.selected { border-color: var(--band2); }
  .game-card.locked { opacity: .55; cursor: default; }
  .game-card .emoji { font-size: 1.8rem; }
  .game-card .gname { font-weight: 700; margin: 4px 0 2px; }
  .game-card .gdesc { font-size: .72rem; color: var(--muted); }

  .teams { display: flex; gap: 12px; width: 100%; margin-bottom: 14px; }
  .team-col { flex: 1; background: var(--panel2); border-radius: 12px; padding: 12px; border: 2px solid transparent; }
  .team-col.blue { border-color: rgba(79,124,255,.5); }
  .team-col.red { border-color: rgba(255,90,95,.5); }
  .team-col h3 { font-size: .9rem; margin-bottom: 8px; }
  .team-col.blue h3 { color: var(--blue); } .team-col.red h3 { color: var(--red); }
  .team-col ul { list-style: none; min-height: 48px; }
  .team-col li, #coop-players li { padding: 4px 0; font-size: .95rem; }
  .team-col li.offline { opacity: .4; }
  .team-col button { width: 100%; margin-top: 8px; padding: 8px; font-size: .85rem; }
  .unassigned { color: var(--muted); font-size: .85rem; margin-bottom: 12px; text-align: center; }

  .phase-box { width: 100%; text-align: center; margin-top: 8px; }
  .phase-box p { color: var(--muted); margin-bottom: 10px; font-size: .95rem; }
  .phase-box .big { color: var(--text); font-size: 1.05rem; }
  .result-pts { font-size: 1.3rem; font-weight: 800; margin: 6px 0; }
  .winner-banner { font-size: 1.7rem; font-weight: 800; margin: 16px 0; text-align: center; }
  .log { background: var(--panel2); border-radius: 10px; padding: 10px 12px; font-size: .8rem; color: var(--muted); width: 100%; margin-top: 10px; text-align: left; }
  .log div { padding: 1px 0; }
  .pill { display: inline-block; background: var(--panel2); border-radius: 999px; padding: 4px 12px; margin: 2px; font-size: .85rem; }
  .hand-card {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 56px; padding: 10px 8px; margin: 4px; border-radius: 10px; border: 2px solid #3a4057;
    background: var(--panel2); cursor: pointer; font-weight: 700; font-size: 1.1rem; color: var(--text);
  }
  .hand-card:hover { border-color: var(--band2); }
  .hand-card small { font-size: .65rem; color: var(--muted); font-weight: 400; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #2e3348; padding: 10px 20px; border-radius: 10px; font-size: .9rem;
    opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,.4); z-index: 10;
  }
  .toast.show { opacity: 1; }

  /* wavelength */
  .scorebar { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; }
  .score { font-size: 1.5rem; font-weight: 800; padding: 4px 14px; border-radius: 10px; }
  .score.blue { color: var(--blue); background: rgba(79,124,255,.12); }
  .score.red  { color: var(--red);  background: rgba(255,90,95,.12); }
  .score.active-team { outline: 2px solid currentColor; }
  .round-info { color: var(--muted); font-size: .8rem; text-align: center; }
  .spectrum { display: flex; justify-content: space-between; width: 100%; font-weight: 700; font-size: 1.05rem; }
  .spectrum .left { color: var(--band2); } .spectrum .right { color: var(--band3); }
  svg { width: 100%; display: block; user-select: none; }
  .clue-banner { background: var(--panel2); border-radius: 12px; padding: 12px 16px; width: 100%; text-align: center; margin: 10px 0; font-size: 1.15rem; font-weight: 700; }
  .clue-banner .lbl { display: block; color: var(--muted); font-size: .7rem; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
  .psychic-note { font-size: .8rem; color: var(--band4); margin-top: 6px; }

  /* codenames */
  .cn-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; margin: 10px 0; }
  .cn-tile {
    padding: 10px 2px; border-radius: 8px; font-size: .68rem; font-weight: 700; text-align: center;
    background: #3a4057; color: var(--text); border: none; cursor: pointer; text-transform: uppercase;
  }
  .cn-tile.k-blue { outline: 2px solid var(--blue); }
  .cn-tile.k-red { outline: 2px solid var(--red); }
  .cn-tile.k-assassin { outline: 2px solid #000; background: #23242a; }
  .cn-tile.r-blue { background: var(--blue); }
  .cn-tile.r-red { background: var(--red); }
  .cn-tile.r-neutral { background: #8a8f a3; background: #7a7f93; color: #22232b; }
  .cn-tile.r-assassin { background: #000; }

  /* hanabi */
  .hb-card {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    width: 44px; height: 60px; margin: 3px; border-radius: 8px; font-weight: 800; font-size: 1.2rem;
    background: var(--panel2); border: 2px solid #3a4057; color: #fff; cursor: default;
  }
  .hb-red { background: #a33; } .hb-yellow { background: #a90; } .hb-green { background: #2a7; }
  .hb-blue { background: #36c; } .hb-white { background: #ccc; color: #222; }

  /* wavelength side-by-side layout */
  .wl-layout { display: grid; gap: 12px; grid-template-columns: 1fr; width: 100%; }
  @media (min-width: 1000px) {
    .wl-layout { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
    .wl-right { position: sticky; top: 12px; }
  }

  /* card faces (love letter / coup) */
  .ll-card {
    width: 108px; min-height: 152px; border-radius: 12px; margin: 4px;
    background: linear-gradient(165deg, #2b3046, #1a1d29);
    border: 2px solid var(--cc, #3a4057);
    display: inline-flex; flex-direction: column; padding: 8px; text-align: center;
    vertical-align: top; cursor: pointer; color: var(--text);
    box-shadow: 0 4px 12px rgba(0,0,0,.35);
    transition: transform .08s ease;
  }
  .ll-card:hover { transform: translateY(-3px); }
  .ll-card.static { cursor: default; }
  .ll-card.static:hover { transform: none; }
  .ll-card .llv { font-weight: 800; font-size: 1.05rem; text-align: left; color: var(--cc); line-height: 1; }
  .ll-card .llart { font-size: 2.3rem; margin: 6px 0 2px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .ll-card .llname { font-weight: 700; font-size: .82rem; letter-spacing: .03em; }
  .ll-card .lltext { font-size: .58rem; color: var(--muted); margin-top: 4px; line-height: 1.35; }
  .ll-mini {
    display: inline-flex; align-items: center; gap: 3px; border-radius: 6px;
    border: 1px solid var(--cc, #3a4057); padding: 1px 6px; margin: 1px;
    font-size: .68rem; font-weight: 700; color: var(--cc);
  }

  /* love letter side panels */
  .ll-layout { display: grid; gap: 12px; grid-template-columns: 1fr; width: 100%; }
  .ll-main { order: 1; min-width: 0; }
  .ll-log-box { order: 2; }
  .ll-ref { order: 3; }
  .side-box { background: var(--panel2); border-radius: 12px; padding: 12px; font-size: .78rem; }
  .side-box h4 { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .ll-ref .ref-row { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); align-items: flex-start; }
  .ll-ref .ref-row:last-child { border-bottom: none; }
  .ll-ref .ref-v { font-weight: 800; min-width: 30px; color: var(--cc); }
  .ll-ref .ref-txt b { display: block; font-size: .74rem; }
  .ll-ref .ref-txt span { color: var(--muted); font-size: .66rem; line-height: 1.3; }
  .ll-log-box .entries { max-height: 300px; overflow-y: auto; color: var(--muted); }
  .ll-log-box .entries div { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
  @media (min-width: 1000px) {
    #scr-game { max-width: 1120px; }
    .ll-layout { grid-template-columns: 230px minmax(0, 1fr) 250px; align-items: start; }
    .ll-ref { order: 1; } .ll-main { order: 2; } .ll-log-box { order: 3; position: sticky; top: 12px; }
  }
</style>
</head>
<body>
<h1 id="site-title" style="cursor:pointer" title="back to dashboard">🎲 UHLE.PINK</h1>
<div class="tagline">mini board games for game night</div>

<!-- HOME -->
<div class="screen active" id="scr-home">
  <div class="card">
    <input type="text" id="name-input" placeholder="Your name" maxlength="20">
    <button id="btn-create" style="width:100%">Create a room</button>
    <div class="divider">— or join a friend —</div>
    <div class="row">
      <input type="text" id="code-input" placeholder="Room code" maxlength="4" style="text-transform:uppercase">
      <button id="btn-join" class="secondary">Join</button>
    </div>
  </div>
</div>

<!-- LOBBY / DASHBOARD -->
<div class="screen" id="scr-lobby">
  <div class="card">
    <div class="room-code" id="lobby-code"></div>
    <div class="room-hint">share this code with your friends</div>
    <button id="btn-peek-back" style="display:none;width:100%;margin-bottom:12px">▶ Return to the game</button>
    <div id="share-box" style="display:none;background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:14px;text-align:center">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:6px">🌍 friends elsewhere? send them this link:</div>
      <a id="share-url" href="#" target="_blank" style="color:var(--blue);font-weight:600;word-break:break-all"></a>
      <button id="share-copy" class="secondary" style="display:block;width:100%;margin-top:8px;padding:8px;font-size:.85rem">Copy link</button>
      <div id="share-pass" style="font-size:.75rem;color:var(--band4);margin-top:8px"></div>
    </div>

    <div class="game-grid" id="game-grid"></div>
    <div id="game-options"></div>

    <div class="teams" id="teams-box" style="display:none">
      <div class="team-col blue">
        <h3>BLUE</h3><ul id="team-blue"></ul>
        <button data-team="blue">Join Blue</button>
      </div>
      <div class="team-col red">
        <h3>RED</h3><ul id="team-red"></ul>
        <button data-team="red" class="red">Join Red</button>
      </div>
    </div>
    <div class="unassigned" id="unassigned"></div>
    <div id="player-list-box" style="display:none;background:var(--panel2);border-radius:12px;padding:12px;margin-bottom:12px">
      <h3 style="font-size:.9rem;color:var(--band2);margin-bottom:6px">PLAYERS</h3>
      <ul id="coop-players" style="list-style:none"></ul>
    </div>
    <button id="btn-start" style="width:100%">Start game</button>
    <p id="start-hint" style="color:var(--muted);font-size:.75rem;text-align:center;margin-top:8px"></p>
    <button id="btn-leave" class="secondary" style="width:100%;margin-top:10px;padding:8px;font-size:.85rem">🚪 Leave this room</button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="scr-game">
  <div class="card" id="game-root"></div>
  <button id="btn-lobby" class="secondary" style="margin-top:10px;display:none;padding:8px 16px;font-size:.85rem">⬅ Back to lobby</button>
</div>

<div class="toast" id="toast"></div>
<div id="version-footer" style="position:fixed;bottom:6px;right:10px;font-size:.65rem;color:var(--muted);opacity:.7"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
if (typeof io === 'undefined') {
  document.getElementById('scr-home').insertAdjacentHTML('afterbegin',
    `<div class="card" style="margin-bottom:12px;border:1px solid var(--red)">
       <b style="color:var(--red)">⚠️ Not connected to the game server</b>
       <p style="color:var(--muted);font-size:.9rem;margin-top:8px">
         Run <code>npm start</code> in the mini-games folder, then open <b>http://localhost:3000</b>.
         (If your address bar starts with <code>file://</code>, that's the problem.)
       </p></div>`);
  throw new Error('socket.io not loaded');
}
const socket = io();
let connected = false;
socket.on('connect', () => { connected = true; });
socket.on('disconnect', () => { connected = false; });
socket.on('connect_error', () => { connected = false; toast("Can't reach the game server"); });

const $ = id => document.getElementById(id);
let S = null;
const GameUI = {}; // per-game renderers register here

const GAME_INFO = {
  wavelength: { emoji: '🌈', name: 'Wavelength', desc: 'guess the vibe · 2+ / 4+', },
  themind:    { emoji: '🧠', name: 'The Mind', desc: 'silent co-op · 2-4' },
  hanabi:     { emoji: '🎆', name: 'Hanabi', desc: 'fireworks co-op · 2-5' },
  spyfall:    { emoji: '🕵️', name: 'Spyfall', desc: 'find the spy · 3+' },
  loveletter: { emoji: '💌', name: 'Love Letter', desc: 'deduction · 2-4' },
  coup:       { emoji: '👑', name: 'Coup', desc: 'bluffing · 3-6' },
  codenames:  { emoji: '🗝️', name: 'Codenames', desc: 'word teams · 4+' },
  werewolf:   { emoji: '🐺', name: 'Werewolf', desc: 'one night · 3-8' },
  justone:    { emoji: '☝️', name: 'Just One', desc: 'word clues co-op · 3-7' },
  resistance: { emoji: '🎖️', name: 'The Resistance', desc: 'spies vs missions · 5-10' },
  undercover: { emoji: '🥸', name: 'Undercover', desc: 'word impostors · 3-10' },
};

function show(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(screen).classList.add('active');
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2500);
}
function me() { return S && S.players.find(p => p.id === S.you); }
function playerName(id) { const p = S && S.players.find(p => p.id === id); return p ? p.name : '?'; }
function esc(x) { return String(x).replace(/</g, '&lt;'); }
function act(type, extra) { socket.emit('action', Object.assign({ type }, extra || {})); }
function isHost() { return S && S.you === S.hostId; }

// ---------- join / create ----------
function saveSession(code, name) { sessionStorage.setItem('wl', JSON.stringify({ code, name })); }
$('btn-create').onclick = () => {
  const name = $('name-input').value.trim();
  if (!name) return toast('Enter your name first');
  if (!connected) return toast('Not connected to the server');
  socket.emit('create_room', { name }, res => {
    if (res.error) return toast(res.error);
    saveSession(res.code, name);
  });
};
$('btn-join').onclick = () => {
  const name = $('name-input').value.trim();
  const code = $('code-input').value.trim().toUpperCase();
  if (!name) return toast('Enter your name first');
  if (!code) return toast('Enter a room code');
  if (!connected) return toast('Not connected to the server');
  socket.emit('join_room', { code, name }, res => {
    if (res.error) return toast(res.error === 'Room not found'
      ? 'Room not found — double-check the code with the host (rooms also reset if the server updates)'
      : res.error);
    saveSession(code, name);
  });
};
socket.on('connect', () => {
  const saved = sessionStorage.getItem('wl');
  if (saved && !S) {
    const { code, name } = JSON.parse(saved);
    if (code && name) socket.emit('join_room', { code, name }, () => {});
  }
});
socket.on('toast', toast);

// show which version is live, bottom-right
fetch('/version').then(r => r.json()).then(v => {
  const up = v.uptime_minutes < 60 ? v.uptime_minutes + 'min' : Math.floor(v.uptime_minutes / 60) + 'h';
  document.getElementById('version-footer').textContent = `v.${v.commit} · up ${up}`;
  document.getElementById('version-footer').title = v.update;
}).catch(() => {});

// ---------- state routing ----------
let lobbyPeek = false; // player chose to look at the dashboard while a game runs
socket.on('state', state => {
  const hadGame = !!(S && S.game);
  S = state;
  if (!S.game) { lobbyPeek = false; renderLobby(); return; }
  if (!hadGame) lobbyPeek = false; // a fresh game just started — pull everyone in
  if (lobbyPeek) { renderLobby(); return; }
  renderGame();
});

// site title = back to the dashboard (or home if not in a room)
$('site-title').onclick = () => {
  if (!S) { show('scr-home'); return; }
  if (S.game) { lobbyPeek = true; renderLobby(); }
  else renderLobby();
};
socket.on('dial', ({ pos }) => {
  if (GameUI.wavelength && GameUI.wavelength.onDial) GameUI.wavelength.onDial(pos);
});

// ---------- share link ----------
let shareFetched = false;
async function loadShare() {
  if (shareFetched) return;
  shareFetched = true;
  let info = null;
  try {
    for (let i = 0; i < 6; i++) {
      info = await (await fetch('/share')).json();
      if (info && info.url) break;
      await new Promise(r => setTimeout(r, 2000));
    }
    if (!info || !info.url) return;
    $('share-box').style.display = '';
    $('share-url').textContent = info.url;
    $('share-url').href = info.url;
    if (info.password) $('share-pass').textContent = `if the link asks for a "tunnel password", it's: ${info.password}`;
    $('share-copy').onclick = () => {
      navigator.clipboard.writeText(info.url + (info.password ? ` (password: ${info.password})` : ''))
        .then(() => toast('Link copied!')).catch(() => toast('Copy failed'));
    };
  } catch {}
}

// ---------- lobby / dashboard ----------
document.querySelectorAll('[data-team]').forEach(btn => {
  btn.onclick = () => socket.emit('set_team', { team: btn.dataset.team });
});
$('btn-start').onclick = () => socket.emit('start_game');
$('btn-leave').onclick = () => {
  if (S && S.game && !['gameover', 'win', 'reveal'].includes(S.game.phase)) return toast('Game in progress — return to the game or wait for it to end');
  socket.emit('leave_room', () => {});
  sessionStorage.removeItem('wl');
  S = null;
  lobbyPeek = false;
  $('code-input').value = '';
  show('scr-home');
};
$('btn-lobby').onclick = () => {
  const over = S.game && ['gameover', 'win', 'reveal'].includes(S.game.phase);
  if (!over && !confirm('Abandon the current game and send everyone back to the lobby?')) return;
  socket.emit('to_lobby');
};

function usesTeams() {
  return S.gameName === 'codenames' || (S.gameName === 'wavelength' && S.mode !== 'coop');
}

function renderLobby() {
  show('scr-lobby');
  loadShare();
  $('lobby-code').textContent = S.code;
  const peeking = !!(S.game && lobbyPeek);
  $('btn-peek-back').style.display = peeking ? '' : 'none';
  $('btn-peek-back').onclick = () => { lobbyPeek = false; renderGame(); };
  const host = isHost();

  // game cards
  const grid = $('game-grid');
  grid.innerHTML = '';
  for (const [key, info] of Object.entries(GAME_INFO)) {
    const div = document.createElement('div');
    div.className = 'game-card' + (S.gameName === key ? ' selected' : '') + (host ? '' : ' locked');
    div.innerHTML = `<div class="emoji">${info.emoji}</div><div class="gname">${info.name}</div><div class="gdesc">${info.desc}</div>`;
    if (host) div.onclick = () => socket.emit('set_game', { game: key });
    grid.appendChild(div);
  }

  // per-game options
  const opts = $('game-options');
  opts.innerHTML = '';
  if (S.gameName === 'wavelength') {
    const coop = S.mode === 'coop';
    opts.innerHTML = `
      <div class="row" style="margin-bottom:10px">
        <button id="mode-teams" class="secondary" ${host ? '' : 'disabled'} style="${!coop ? 'outline:2px solid var(--blue)' : ''}">⚔️ Teams</button>
        <button id="mode-coop" class="secondary" ${host ? '' : 'disabled'} style="${coop ? 'outline:2px solid var(--band2)' : ''}">🤝 Co-op</button>
      </div>
      ${coop ? `
      <div class="row" style="margin-bottom:10px">
        ${[10, 20, 30].map(r => `<button data-rounds="${r}" class="secondary" ${host ? '' : 'disabled'} style="${S.coopRounds === r ? 'outline:2px solid var(--band2)' : ''}">${r} turns</button>`).join('')}
      </div>
      <input type="text" id="team-name-input" placeholder="Team name (for the leaderboard)" maxlength="24" ${host ? '' : 'disabled'} value="${esc(S.teamName || '')}">` : ''}`;
    if (host) {
      opts.querySelector('#mode-teams').onclick = () => socket.emit('set_mode', { mode: 'teams' });
      opts.querySelector('#mode-coop').onclick = () => socket.emit('set_mode', { mode: 'coop' });
      opts.querySelectorAll('[data-rounds]').forEach(b => b.onclick = () => socket.emit('set_rounds', { rounds: +b.dataset.rounds }));
      const tn = opts.querySelector('#team-name-input');
      if (tn) tn.addEventListener('change', () => socket.emit('set_team_name', { name: tn.value }));
    }
  }

  // teams vs flat player list
  const teams = usesTeams();
  $('teams-box').style.display = teams ? '' : 'none';
  $('unassigned').style.display = teams ? '' : 'none';
  $('player-list-box').style.display = teams ? 'none' : '';
  if (teams) {
    for (const team of ['blue', 'red']) {
      const ul = $('team-' + team);
      ul.innerHTML = '';
      S.players.filter(p => p.team === team).forEach(p => {
        const li = document.createElement('li');
        li.textContent = p.name + (p.id === S.you ? ' (you)' : '') + (p.id === S.hostId ? ' 👑' : '');
        if (!p.connected) li.classList.add('offline');
        ul.appendChild(li);
      });
    }
    const un = S.players.filter(p => !p.team);
    $('unassigned').textContent = un.length ? 'Picking a team: ' + un.map(p => p.name).join(', ') : '';
  } else {
    const ul = $('coop-players');
    ul.innerHTML = '';
    S.players.forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.name + (p.id === S.you ? ' (you)' : '') + (p.id === S.hostId ? ' 👑' : '');
      if (!p.connected) li.style.opacity = '.4';
      ul.appendChild(li);
    });
  }
  $('btn-start').style.display = isHost() ? '' : 'none';
  $('start-hint').textContent = isHost() ? `selected: ${GAME_INFO[S.gameName].name} — only you (host) can start` : `${playerName(S.hostId)} picks the game and starts`;
}

// ---------- game routing ----------
function renderGame() {
  show('scr-game');
  const ui = GameUI[S.gameName];
  const root = $('game-root');
  const over = ['gameover', 'win', 'reveal'].includes(S.game.phase);
  $('btn-lobby').style.display = isHost() ? '' : 'none';
  $('btn-lobby').textContent = over ? '⬅ Back to lobby — pick the next game' : '⬅ Back to lobby (abandon game)';
  if (!ui) { root.innerHTML = '<p>Unknown game…</p>'; return; }
  ui.render(root, S);
}
function rematchRow(host) {
  return host
    ? `<button style="width:100%" onclick="act('rematch')">Rematch</button>`
    : `<p style="color:var(--muted)">waiting for the host to start a rematch…</p>`;
}
